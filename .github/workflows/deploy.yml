name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run pages:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Minify worker bundles
        run: |
          echo "=== Sizes BEFORE ==="
          find .open-next -name "*.mjs" -exec du -sh {} \;

          # Удаляем WASM base64 файлы — не нужны при PrismaNeonHttp (HTTP adapter)
          echo "=== Removing wasm-base64 files ==="
          find .open-next -name "*.wasm-base64.mjs" -print -delete

          # Минифицируем whitespace+syntax (НЕ identifiers — сломает строковые патчи)
          echo "=== Minifying ==="
          find .open-next -name "*.mjs" | while read f; do
            npx esbuild "$f" --bundle=false --minify-whitespace --minify-syntax --allow-overwrite --outfile="$f"
          done

          echo "=== Sizes AFTER ==="
          find .open-next -name "*.mjs" -exec du -sh {} \;

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge CF static cache
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/e210e97d79d6405602910d3928fd5dd2/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"prefixes":["www.ladogaboat.ru/_next/static/"]}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print('Purge OK' if r.get('success') else f'Purge FAILED: {r}')"
