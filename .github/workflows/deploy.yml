name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DIRECT_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: npm run pages:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Minify worker bundles
        run: |
          echo "=== Sizes BEFORE ==="
          find .open-next -name "*.mjs" -exec du -sh {} \;

          echo "=== Removing wasm-base64 files ==="
          find .open-next -name "*.wasm-base64.mjs" -print -delete

          echo "=== Minifying ==="
          find .open-next -name "*.mjs" | while read f; do
            npx esbuild "$f" --bundle=false --minify-whitespace --minify-syntax --allow-overwrite --outfile="$f"
          done

          echo "=== Sizes AFTER ==="
          find .open-next -name "*.mjs" -exec du -sh {} \;

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
